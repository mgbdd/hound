services:
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: hound_agent
    env_file:
      - ./.env
    environment:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: "error"
      TOKENIZERS_PARALLELISM: "false"
      TQDM_DISABLE: "1"
    ports:
      - "8001:8001"
    volumes:
      - ./.env:/app/.env
      - ./config.py:/app/config.py
      - ./agent:/app/agent
      - ./RAG:/app/RAG
      - ./langgraph.json:/app/langgraph.json
      - hf_cache:/root/.cache/huggingface
      - langgraph_data:/app/.langgraph_api   # треды/чекпоинты langgraph API между рестартами
    networks:
      - hound_network
    # agent ни от кого не зависит: читает Qdrant/Langfuse (внешние), процессор пишет
    # в Qdrant независимо. healthy = langgraph импортировал граф и поднял API.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/ok',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  processor_server:
    build:
      context: .
      dockerfile: processor_server/Dockerfile
    container_name: hound_processor
    env_file:
      - ./.env
    environment:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: "error"
      TOKENIZERS_PARALLELISM: "false"
      TQDM_DISABLE: "1"
    ports:
      - "3030:3030"
    volumes:
      - ./.env:/app/.env
      - ./processor_server:/app/processor_server   # монтируем код процессора
    networks:
      - hound_network
    # TCP-проба порта загрузки. start_period большой: Whisper/BLIP/Marian грузятся на импорте.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',3030),timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 300s

  tg_bot:
    build:
      context: .
      dockerfile: tg_bot/Dockerfile
    container_name: hound_tg_bot
    env_file:
      - ./.env
    environment:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: "error"
      TOKENIZERS_PARALLELISM: "false"
      TQDM_DISABLE: "1"
    volumes:
      - ./.env:/app/.env
      - ./chat_data.json:/app/chat_data.json
      - ./last_processed.json:/app/last_processed.json
      - ./tg_bot:/app/tg_bot               # монтируем код бота
    networks:
      - hound_network
    depends_on:
      agent:
        condition: service_healthy
      processor_server:
        condition: service_healthy

  rag_eval:
    profiles: ["eval"]
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: hound_rag_eval
    env_file:
      - ./.env
    environment:
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_VERBOSITY: "error"
      TOKENIZERS_PARALLELISM: "false"
      TQDM_DISABLE: "1"
    # Явные монтирования вместо ./:/app — иначе в контейнер уезжает весь репо, включая .git.
    volumes:
      - ./.env:/app/.env
      - ./config.py:/app/config.py
      - ./agent:/app/agent
      - ./RAG:/app/RAG
      - ./eval:/app/eval
      - ./requirements.eval.txt:/app/requirements.eval.txt
      - hf_cache:/root/.cache/huggingface
    networks:
      - hound_network
    # Single-line shell script: multi-line YAML `command` can split on some setups (Windows / Compose),
    # so python runs without --dataset and sh then tries to execute `--dataset` as a command.
    command:
      - sh
      - -lc
      - >-
        pip install --no-cache-dir -r requirements.eval.txt &&
        python -m eval.run_ragas_eval --dataset eval/dataset.jsonl --output-dir eval/results --fail-on-thresholds eval/thresholds.example.json

networks:
  hound_network:
    driver: bridge

volumes:
  hf_cache:
    driver: local
  langgraph_data:
    driver: local